<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Plane Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🛩️ Space Plane Game</h1>
        
        <div class="ui-panel">
            <div class="ui-element">
                <span class="label">Score:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="ui-element">
                <span class="label">Health:</span>
                <span id="health" class="value health">100</span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="gameOver" class="hidden game-over-screen">
            <div class="game-over-content">
                <h2>GAME OVER</h2>
                <p class="final-score">Final Score: <span id="finalScore">0</span></p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>

        <div class="instructions">
            <p>🎮 <strong>Controls:</strong> Move your mouse to control the plane</p>
            <p>💥 <strong>Shooting:</strong> Your plane shoots automatically</p>
            <p>🔴 <strong>Enemies:</strong> Destroy red enemy planes to gain points</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
